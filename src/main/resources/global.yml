#Logs mode verbose will log all steps in details.
verbose: false

#database has to be on mysql actually
db_host: localhost
db_port: 3306
db_database: bmc
db_user: root
db_password: ""

#display formats
#valid placeholders: {attr_name}, {value}
attribute_display_format: "&7{attr_name}&7: &a+{value}"

#valid placeholders: {value}
attribute_modifier_display_format: "&6(+{value})"

#valid placeholders: {ench_name}, {value}, {value_int}
enchant_display_format: "&7{ench_name} {value}"

#valid placeholders: none
enchant_separator_display_format: "&7,"

#valid placeholders: {health}, {health_max}, {defense}, {mana}, {mana_max}
action_bar_display_format: "&8[&c{health}&7/&c{health_max}&8]&c❤ &7| &8[&a{defense}&8]&a✤ &7| &8[&9{mana}&7/&9{mana_max}&8]&9✯"
